name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── Backend: Elixir + Phoenix ───────────────────────────────────────────────
  backend-test:
    name: Backend (ExUnit)
    env:
      PGUSER: canopy
      PGPASSWORD: canopy
      PGHOST: localhost
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:0.8.6-pg14-trixie
        env:
          POSTGRES_USER: canopy
          POSTGRES_PASSWORD: canopy
          POSTGRES_DB: canopy_test
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
        ports:
          - 5432:5432

    steps:
      - uses: actions/checkout@v4

      - name: Set up Elixir
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.19.5"
          otp-version: "28.0"

      - name: Install runtime search dependency
        run: sudo apt-get update && sudo apt-get install --yes ripgrep

      - name: Cache mix deps
        uses: actions/cache@v4
        with:
          path: |
            backend/deps
            backend/_build
          key: ${{ runner.os }}-mix-${{ hashFiles('backend/mix.lock') }}
          restore-keys: |
            ${{ runner.os }}-mix-

      - name: Install dependencies
        working-directory: backend
        run: mix deps.get

      - name: Compile (warnings as errors)
        working-directory: backend
        run: mix compile --warnings-as-errors
        env:
          MIX_ENV: test

      - name: Check formatting
        working-directory: backend
        run: mix format --check-formatted

      - name: Run tests
        working-directory: backend
        run: mix test --cover
        env:
          MIX_ENV: test
          DATABASE_URL: postgres://canopy:canopy@localhost:5432/canopy_test

      - name: Verify OpenAPI spec is generatable
        working-directory: backend
        run: mix canopy.gen.openapi --output /tmp/canopy-openapi.json
        env:
          MIX_ENV: dev
          DATABASE_URL: postgres://canopy:canopy@localhost:5432/canopy_test

      - name: Upload OpenAPI spec artifact
        uses: actions/upload-artifact@v4
        with:
          name: openapi-spec
          path: /tmp/canopy-openapi.json
          if-no-files-found: error
          retention-days: 7

  # ─── Desktop: SvelteKit + Svelte 5 ──────────────────────────────────────────
  desktop-test:
    name: Desktop (Vitest + svelte-check)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install dependencies
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Type-check (svelte-check)
        working-directory: desktop
        run: pnpm check

      - name: Lint (Biome)
        working-directory: desktop
        run: pnpm biome check .

      - name: Run unit tests
        working-directory: desktop
        run: pnpm test --run

      - name: Build desktop SPA
        working-directory: desktop
        run: pnpm build

  # ─── Rust sidecar ────────────────────────────────────────────────────────────
  rust-test:
    name: Rust (cargo test)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: "1.94.1"
          components: rustfmt, clippy

      - name: Cache cargo artifacts
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            src-tauri/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('src-tauri/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Install system deps (Tauri on Linux)
        run: |
          sudo apt-get update -y
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Check formatting
        working-directory: src-tauri
        run: cargo fmt --check

      - name: Clippy
        working-directory: src-tauri
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: src-tauri
        run: cargo test
